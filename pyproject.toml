[project]
name = "deadlock-stats"
version = "0.1.0"
description = "HLTV equivalent for Valve's Deadlock"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"